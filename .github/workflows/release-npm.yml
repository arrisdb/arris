name: Release npm

# Manual only. Builds the arris binary on each supported platform, stages the
# npm packages, and publishes them only when the `publish` input is true.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (x.y.z); must match [workspace.package] in Cargo.toml"
        required: true
        type: string
      publish:
        description: "Publish to npm (leave off for a dry run that only builds and packs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches Cargo.toml
        run: grep -q "^version = \"${{ inputs.version }}\"" Cargo.toml

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxdo-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: make build

      - name: Check release marker
        run: ./target/release/arris --version | grep -q "(release)"

      - name: Package platform binary
        run: node scripts/package-npm.mjs --binary target/release/arris --platform ${{ matrix.platform }} --version ${{ inputs.version }}

      - name: Package launcher
        if: matrix.platform == 'linux-x64'
        run: node scripts/package-npm.mjs --main --version ${{ inputs.version }}

      - name: Pack
        run: for d in npm/dist/*/; do (cd "$d" && npm pack); done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: npm/dist

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Tarballs keep the binary's exec bit, which artifact upload drops.
      # Platform packages go first so the launcher's optional dependencies resolve.
      - name: Publish
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for t in dist/arris-*/*.tgz; do npm publish "$t" --access public; done
          npm publish dist/arris/arris-*.tgz --access public

      - name: Summary
        run: |
          {
            echo "## arris ${{ inputs.version }}"
            echo
            if [ "${{ inputs.publish }}" = "true" ]; then echo "Published to npm."; else echo "Dry run: built and packed, nothing published."; fi
            echo
            echo "Before publishing:"
            echo "- [ ] \`make bump VERSION=${{ inputs.version }}\` merged to main"
            echo "- [ ] \`NPM_TOKEN\` secret set with publish rights to \`arris\` and \`@arrisdb\`"
            echo "- [ ] Dry run passed on all four platforms"
            echo "- [ ] \`npx arris@${{ inputs.version }}\` smoke tested after publish"
          } >> "$GITHUB_STEP_SUMMARY"
